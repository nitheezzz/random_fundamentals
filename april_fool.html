<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE GIFT INSIDE! 🎁</title>
    <style>
        body { 
            background: linear-gradient(45deg, #00dbde 0%, #fc00ff 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        #scary-button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            position: relative; 
            transition: all 0.1s ease;
        }
        h1 { color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 CONGRATULATIONS! 🎉</h1>
        <p>You've won a brand new iPhone 15 Pro Max!</p>
        <p>Click below to claim your prize immediately:</p>
        
        <button id="scary-button" onmouseover="moveButton()">CLAIM PRIZE NOW</button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('scary-button');
            
           
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        
        document.getElementById('scary-button').onclick = function() {
            alert("🤡 APRIL FOOLS! \n\nNo iPhone here, just some practice code! Better luck next year!");
        };
    </script>

</body>
</html>
